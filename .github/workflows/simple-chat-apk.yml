name: Build Simple Nori Chat APK

on:
  push:
    paths:
      - 'simple-chat/**'
      - '.github/workflows/simple-chat-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: simple-chat
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f simple-chat/app/build/outputs/apk/debug/app-debug.apk
          ls -lh simple-chat/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-simple-chat-apk
          path: simple-chat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
