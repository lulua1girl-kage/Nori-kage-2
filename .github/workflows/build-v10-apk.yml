name: Build Nori V11 native Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-voice-auth-v11

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Capacitor Android runtime
        run: npm install --no-audit --no-fund

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify untouched V10 artifact
        shell: bash
        run: |
          test -f "Nori-KAGE-Modern-V10-Reliability-Mentor-Voice.zip"
          unzip -t "Nori-KAGE-Modern-V10-Reliability-Mentor-Voice.zip"

      - name: Prepare V10 web assets
        shell: bash
        run: |
          rm -rf build-v10 android/app/src/main/assets android/app/src/main/res
          mkdir -p build-v10 android/app/src/main/res/mipmap-xxxhdpi
          unzip -q "Nori-KAGE-Modern-V10-Reliability-Mentor-Voice.zip" -d build-v10

          cp android/v10-android-fix.css build-v10/nori-android-fix.css
          cp android/v10-android-fix.js build-v10/nori-android-fix.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path("build-v10/index.html")
          s=p.read_text(encoding="utf-8")
          if "nori-android-fix.css" not in s:
              s=s.replace("</head>",'  <link rel="stylesheet" href="nori-android-fix.css">\n</head>',1)
          if "nori-android-fix.js" not in s:
              marker='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
              s=s.replace(marker,marker+'\n<script src="nori-android-fix.js"></script>',1)
          s=s.replace("<title>Nori — KAGE Elite Academy</title>","<title>Nori</title>",1)
          p.write_text(s,encoding="utf-8")
          PY

          test -f build-v10/index.html
          test -f build-v10/assets/icon.png
          cp build-v10/assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Restore launcher icon after sync
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp build-v10/assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-v11-native-voice-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error