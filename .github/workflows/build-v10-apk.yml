name: Build Nori V10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V10 artifact and wrapper
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify untouched V10 artifact
        shell: bash
        run: |
          test -f "Nori-KAGE-Modern-V10-Reliability-Mentor-Voice.zip"
          unzip -t "Nori-KAGE-Modern-V10-Reliability-Mentor-Voice.zip"

      - name: Prepare V10 web assets
        shell: bash
        run: |
          rm -rf build-v10 android/app/src/main/assets android/app/src/main/res
          mkdir -p build-v10 android/app/src/main/assets/www
          unzip -q "Nori-KAGE-Modern-V10-Reliability-Mentor-Voice.zip" -d build-v10
          cp -a build-v10/. android/app/src/main/assets/www/
          test -f android/app/src/main/assets/www/index.html

          # Android-only additive patches. The original V10 ZIP stays untouched.
          cp android/v10-android-fix.css android/app/src/main/assets/www/nori-android-fix.css
          cp android/v10-android-fix.js android/app/src/main/assets/www/nori-android-fix.js

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/assets/www/index.html")
          s = p.read_text(encoding="utf-8")
          if "nori-android-fix.css" not in s:
              s = s.replace("</head>", '  <link rel="stylesheet" href="nori-android-fix.css">\n</head>', 1)
          if "nori-android-fix.js" not in s:
              marker = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
              s = s.replace(marker, marker + '\n<script src="nori-android-fix.js"></script>', 1)
          s = s.replace("<title>Nori — KAGE Elite Academy</title>", "<title>Nori</title>", 1)
          p.write_text(s, encoding="utf-8")
          PY

          # Use the V10-owned icon as the Android launcher icon.
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp android/app/src/main/assets/www/assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          grep -q 'nori-android-fix.css' android/app/src/main/assets/www/index.html
          grep -q 'nori-android-fix.js' android/app/src/main/assets/www/index.html
          grep -q '<title>Nori</title>' android/app/src/main/assets/www/index.html

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-v10-fixed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
